[versions]
android-gradle = "9.2.0"
# The NDK the Android libraries build with. Nothing installs it on its own: the workflows install this version with
# sdkmanager, and a local build needs it in the Android SDK.
android-ndk = "28.2.13676358"
junit = "5.14.4"
kotlin-gradle = "2.3.21"
maven-publish = "0.36.0"
tapmoc = "0.4.2"

[libraries]
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin-gradle" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }
