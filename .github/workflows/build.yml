name: Build Checks

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native-libraries.yml

  build:
    name: Check build
    needs: native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle Cache and Environment
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Download the desktop library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-desktop
          path: prebuilt/desktop

      - name: Download the Android libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-android-*
          merge-multiple: true
          path: prebuilt/android

      - name: Build Check
        run: >-
          ./gradlew --console=plain --warning-mode=all
          -PprebuiltNativeLibraries="$PWD/prebuilt"
          :library:jvmTest
          publishToMavenLocal
